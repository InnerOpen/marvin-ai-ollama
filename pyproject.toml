[project]
name = "marvin-ai-ollama"
version = "0.1.0"
description = "Ollama for Marvin: self-hosted models (chat, tools, structured output, embeddings, model pulls) as an AI provider plugin."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 0.8: the AI provider contract (AIProvider, AIProviderPlugin, Credential) and its conformance kit.
    "marvin-integration-sdk>=0.8,<1",
    # Ollama's REST API is plain HTTP; no vendor SDK.
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.urls]
Repository = "https://github.com/InnerOpen/marvin-ai-ollama"

# The seam that makes the plugin discoverable: Marvin scans this group at startup. The slug replaces core's
# built-in provider of the same name.
[project.entry-points."marvin.ai_providers"]
ollama = "marvin_ai_ollama:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin_ai_ollama"]

# Dev only: the SDK commit Marvin core pins (pyproject.toml there), so tests run against the contract the
# image ships. Released installs take the SDK from plugins.packages / the index.
[tool.uv.sources]
marvin-integration-sdk = { git = "https://github.com/InnerOpen/marvin-integration-sdk", rev = "39c49208defe5feaa1a9c59a7aa9b0d9fd2c0a60" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real Ollama server (OLLAMA_BASE_URL); skipped when unset"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
